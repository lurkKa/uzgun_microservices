spring:
  application:
    name: uzgun-user-service
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          audiences: ${JWT_AUDIENCE:uzgun-user-service}
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
checkout:
  eligibility:
    enabled: ${CHECKOUT_ELIGIBILITY_ENABLED:false}
risk:
  base-url: ${RISK_BASE_URL:}
  connect-timeout: 500ms
  read-timeout: 2s
logging:
  pattern:
    level: "%5p [traceId=%X{traceId}]"
